name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://claims:claims@localhost:5432/claims_engine?schema=public
      AI_PROVIDER: demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Run backend tests
        run: npm test
        working-directory: api

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web
